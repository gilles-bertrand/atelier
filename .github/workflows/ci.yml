name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test · lint · typecheck
    runs-on: macos-14 # Apple Silicon (arm64), cible unique du projet
    timeout-minutes: 20
    env:
      # Le binaire Electron n'est pas nécessaire pour les tests/lint/typecheck.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build de l'app
        run: pnpm --filter @atelier/desktop build
