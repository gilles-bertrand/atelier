# Packaging macOS arm64 (brief : electron-builder, signature + notarisation).
# Signature : CSC_LINK / CSC_KEY_PASSWORD (certificat « Developer ID Application »)
#   ou CSC_NAME si le certificat est dans le trousseau.
# Notarisation : APPLE_API_KEY (chemin .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER,
#   ou APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.
# Sans ces variables, le build reste non signé (usage local).
appId: eu.triptyk.atelier
productName: Atelier
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # limactl + guest agents, téléchargés par scripts/fetch-lima.ts (agent Sandbox).
  - from: resources/lima
    to: lima
    filter: ['**/*']
  - from: ../../lima
    to: lima-templates
    filter: ['*.yaml', 'provision/**']
  # Skills d'exemple copiés au premier lancement dans ~/Atelier/skills (installExampleSkills).
  - from: ../../packages/skills/examples
    to: skills-examples
    filter: ['**/*']
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  minimumSystemVersion: '14.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: true
