<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icône d'Atelier : un chevalet (le « A » de l'atelier) et une étincelle (l'agent).
       Grille macOS : carré arrondi de 824 px centré, marge de 100 px pour l'ombre.
       Source de build/icon.png (1024 px), régénéré par le script « icon » de apps/desktop/package.json. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3150"/>
      <stop offset="1" stop-color="#14151F"/>
    </linearGradient>
    <!-- userSpaceOnUse : un trait horizontal ou vertical a une boîte englobante plate. -->
    <linearGradient id="easel" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="780">
      <stop offset="0" stop-color="#FBF3E6"/>
      <stop offset="1" stop-color="#E6D5BC"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F08A4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g fill="none" stroke="url(#easel)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 760 L492 300 L622 760"/>
    <path d="M410 600 H574"/>
    <path d="M492 600 V770" stroke-opacity="0.55"/>
  </g>

  <path fill="url(#spark)"
        d="M690 268 C700 330 718 348 780 358 C718 368 700 386 690 448 C680 386 662 368 600 358 C662 348 680 330 690 268 Z"/>
  <circle cx="770" cy="470" r="18" fill="#FFD27A" fill-opacity="0.85"/>
</svg>
